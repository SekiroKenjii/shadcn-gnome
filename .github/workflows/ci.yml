name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Contrast checks
        run: for theme in graphite mono vercel; do node bin/shadcn-gnome.mjs contrast --theme "$theme"; done

  gdm:
    name: Greeter gresource builds and validates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y gnome-shell-common libglib2.0-bin libglib2.0-dev-bin
      - run: npm ci
      - run: dev/gdm-preview.sh --theme graphite --build-only
      - run: dev/gdm-preview.sh --theme vercel --scheme light --build-only

  screens:
    name: Headless GNOME Shell screenshots
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: registry.fedoraproject.org/fedora:latest
      # bubblewrap needs to create a mount namespace for the greeter preview
      options: --privileged
    steps:
      - run: >
          dnf install -y --setopt=install_weak_deps=False
          gnome-shell gjs dbus-daemon accountsservice bubblewrap glib2-devel librsvg2 mesa-dri-drivers
          gsettings-desktop-schemas dconf gtk-update-icon-cache fontconfig nodejs npm git
      - uses: actions/checkout@v4
      - run: npm ci
      - run: dev/headless/capture.sh --theme graphite --scheme both
      - run: dev/gdm-preview.sh --theme graphite --shot build/screens/graphite/greeter-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: build/screens/
